<div class="row animated fadeIn">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <div class="text-right">
          <button [routerLink]="['/admin/list/point/sale']"
            class="btn waves-effect waves-light btn-rounded btn-primary">
            <i class="fas fa-arrow-alt-circle-left"></i>
            Back
          </button>
        </div>

        <div class="container">
          <form #form="ngForm" [formGroup]="point" (ngSubmit)="ngSubmit()" autocomplete="off">
            <div class="row">
              <div class="col-sm-12 col-md-6">
                <input hidden formControlName="id" />

                <div class="form-group">
                  <label> Point of sale name </label>
                  <input maxlength="1000" class="form-material form-control" type="text" formControlName="name"
                    [class.is-invalid]="invalidName" required />
                  <small *ngIf="invalidName" class="text-danger">
                    This field is requiered
                  </small>
                  <small class="text-danger" *ngIf="point.value.name.length > 99">
                    Only 100 Characters
                  </small>
                </div>

                <div class="form-group">
                  <label>Logo </label>
                  <input maxlength="250" class="form-material form-control" type="text" formControlName="logo" required />
                  <small class="text-danger" *ngIf="point.value.logo.length > 249">
                    Only 250 Characters
                  </small>
                  <small *ngIf="invalidLogo" class="text-danger">
                    This field is required
                  </small>
                </div>

                <div class="form-group">
                  <label> Ubication</label>
                  <input maxlength="250" class="form-material form-control" type="text" formControlName="address"
                    [class.is-invalid]="invalidAddress" required />
                  <small class="text-danger" *ngIf="point.value.address.length > 249">
                    Only 250 Characters
                  </small>
                </div>
              </div>

              <div class="col-sm-12 col-md-6 text-center">
                <h4>Image</h4>
                <div *ngIf="point.value.logo.length > 20" class="form-group container text-center">
                  <img  class="rounded" src="{{point.value.logo}}" height="60%" width="90%"
                    alt="logo">
                </div>
              </div>
            </div>

            <div class="form-group">
              <div *ngIf="button === 1" class="container col-7">
                <button type="submit" [disabled]="point.invalid" class="btn btn-success btn-block fas">
                  SAVE <i class="fas fa-user-plus"></i>
                </button>
              </div>
              <div *ngIf="button === 2" class="container col-7">
                <button type="submit" [disabled]="point.invalid" class="btn btn-warning btn-block fas">
                  UPDATE <i class="fas fa-user-edit"></i>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
