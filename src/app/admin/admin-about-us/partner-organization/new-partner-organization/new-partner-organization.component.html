<div class="row animated fadeIn">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <div class="text-right">
          <button [routerLink]="['/admin/list/partner/organization']"
            class="btn waves-effect waves-light btn-rounded btn-primary">
            <i class="fas fa-arrow-alt-circle-left"></i>
            Back
          </button>
        </div>

        <div class="container">
          <form #form="ngForm" [formGroup]="partner" (ngSubmit)="ngSubmit()" autocomplete="off">
            <input hidden formControlName="id" />

            <div class="container">
              <div class="row">
                <div class="col-sm-8">
                  <div class="form-group">
                    <label> Partner Organization Name (English)</label>
                    <input maxlength="250" class="form-material form-control" type="text" formControlName="nameEn"
                      [class.is-invalid]="invalidNameEn" required />
                    <small *ngIf="invalidNameEn" class="text-danger">
                      This field is requiered
                    </small>
                    <small class="text-danger" *ngIf="partner.value.nameEn.length > 249">
                      Limit is 250 Characters
                    </small>
                  </div>
                  <div class="form-group">
                    <label> Partner Organization Name (Spanish)</label>
                    <input maxlength="250" class="form-material form-control" type="text" formControlName="nameSp"
                      [class.is-invalid]="invalidNameSp" required />
                    <small *ngIf="invalidNameSp" class="text-danger">
                      This field is requiered
                    </small>
                    <small class="text-danger" *ngIf="partner.value.nameSp.length > 249">
                      Limit is 250 Characters
                    </small>
                  </div>
                  <div class="form-group">
                    <label> Logo</label>
                    <input maxlength="250" [class.is-invalid]="invalidLogo" class="form-material form-control"
                      type="text" formControlName="logo" required />
                    <small *ngIf="invalidLogo" class="text-danger">
                      This field is requiered
                    </small>
                    <small class="text-danger" *ngIf="partner.value.logo.length > 249">
                      Limit is 250 Characters
                    </small>
                  </div>
                </div>
                <div class="col-sm-4 text-center">
                  <h4>Image</h4>
                  <div *ngIf="partner.value.logo.length > 20" class="form-group container text-center">
                    <img  class="rounded" src="https://drive.google.com/uc?export=view&id={{partner.value.logo}}" height="80%"
                      width="100%">
                  </div>
                </div>
              </div>
            </div>


            <div class="container">
              <div class="form-group">
                <label> URL Site</label>
                <input maxlength="250" class="form-material form-control" type="text" formControlName="url_site"
                  [class.is-invalid]="invalidURL" required />
                <small *ngIf="invalidURL" class="text-danger">
                  Enter valid url
                </small>
                <small class="text-danger" *ngIf="partner.value.url_site.length > 249">
                  Limit is 250 Characters
                </small>
              </div>
            </div>

            <input hidden formControlName="partner_organization_fk" />
            <input hidden formControlName="category_languajes_fk" />

            <div class="container">
              <div class="row">
                <div class="col-sm-6">
                  <div class="form-group">
                    <label> Description in English
                      <small>
                        (Limit 500 Characters - {{partner.value.descriptionEn.length}})
                      </small>
                    </label>
                    <textarea   rows="5" maxlength="500" class="form-material form-control" type="text" formControlName="descriptionEn"
                      [class.is-invalid]="invalidDescriptionEn" required></textarea>
                    <small *ngIf="invalidDescriptionEn" class="text-danger">
                      This field is requiered
                    </small>
                    <small class="text-danger" *ngIf="partner.value.descriptionEn.length > 459">
                      Limit is 500 Characters
                    </small>
                  </div>
                </div>
                <div class="col-sm-6">
                  <div class="form-group">
                    <label> Description in Spanish
                      <small>
                        (Limit 500 Characters - {{partner.value.descriptionSp.length}})
                      </small>
                    </label>
                    <textarea  rows="5" maxlength="500" class="form-material form-control" type="text" formControlName="descriptionSp"
                      [class.is-invalid]="invalidDescriptionSp" required></textarea>
                    <small *ngIf="invalidDescriptionSp" class="text-danger">
                      This field is requiered
                    </small>
                    <small class="text-danger" *ngIf="partner.value.descriptionSp.length > 459">
                      Limit is 500 Characters
                    </small>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-group">
              <div *ngIf="button === 1" class="container col-7">
                <button type="submit" [disabled]="partner.invalid" class="btn btn-success btn-block fas">
                  SAVE <i class="fas fa-user-plus"></i>
                </button>
              </div>
              <div *ngIf="button === 2" class="container col-7">
                <button type="submit" [disabled]="partner.invalid" class="btn btn-warning btn-block fas">
                  UPDATE <i class="fas fa-user-edit"></i>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
