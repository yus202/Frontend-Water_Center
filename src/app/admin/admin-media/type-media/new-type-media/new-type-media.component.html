<div class="row animated fadeIn">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <div class="text-right">
            <button [routerLink]="['/admin/list/type/media']"
              class="btn waves-effect waves-light btn-rounded btn-primary">
              <i class="fas fa-arrow-alt-circle-left"></i>
              Back
            </button>
          </div>
  
          <div class="container">
            <form #form="ngForm" [formGroup]="media" (ngSubmit)="ngSubmit()" autocomplete="off">
              <input hidden formControlName="id" />
  
              <!-- <div class="row"> -->
                  <div class="col">
                    <div class="form-group">
                        <label> Media Name</label>
                        <input maxlength="150" class="form-material form-control" type="text" formControlName="name"
                          [class.is-invalid]="invalidName" required />
                        <small *ngIf="invalidName" class="text-danger">
                          This field is requiered
                        </small>
                        <small class="text-danger" *ngIf="media.value.name.length > 149">
                          Only 150 Characters
                        </small>
                      </div>
                  </div>
  
              <div class="form-group">
                <div *ngIf="button === 1" class="container col-7">
                  <button type="submit" [disabled]="media.invalid" class="btn btn-success btn-block fas">
                    SAVE <i class="fas fa-user-plus"></i>
                  </button>
                </div>
                <div *ngIf="button === 2" class="container col-7">
                  <button type="submit" [disabled]="media.invalid" class="btn btn-warning btn-block fas">
                    UPDATE <i class="fas fa-user-edit"></i>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
