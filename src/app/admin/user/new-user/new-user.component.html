<div class="row animated fadeIn">
    <div class="col-12">
        <div class="card">
            <div class="card-body">

                <div class="text-right">
                    <button [routerLink]="['/admin/user/list']"
                        class="btn waves-effect waves-light btn-rounded btn-primary">
                        <i class="fas fa-arrow-alt-circle-left"></i>
                        Back
                    </button>
                </div>

                <div class="container">
                    <form #form="ngForm" [formGroup]="user" (ngSubmit)="onSubmit()" autocomplete="off">
                        <input hidden formControlName="id" />

                        <div class="row">
                            <div class="col-sm-7">
                                <div class="form-group">
                                    <label> Name </label>
                                    <input class="form-material form-control" type="text" formControlName="name"
                                        [class.is-invalid]="invalidName" required />
                                    <small *ngIf="invalidName" class="text-danger">
                                        This field is requiered
                                    </small>
                                </div>

                                <div class="form-group">
                                    <label> Email </label>
                                    <input class="form-material form-control" type="email" formControlName="email"
                                        email="true" [class.is-invalid]="invalidEmail" required />
                                    <small *ngIf="invalidEmail" class="text-danger">
                                        Check your email
                                    </small>
                                </div>
                                <div class="form-group">
                                    <label> Image <small>(Optional)</small></label>
                                    <input maxlength="100" class="form-material form-control" type="text"
                                        formControlName="image" />
                                </div>
                            </div>
                            <div class="col-sm-5 text-center">
                                <h4>Image Selected</h4>
                                <div *ngIf="user.value.image.length > 20" class="form-group container text-center">
                                    <img src="{{
                                        user.value.image
                                      }}" height="40%" width="70%" />
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col">
                                <div class="form-group">
                                    <div class="form-row form-group password">
                                        <label> Password Confirmation </label>
                                        <div class="input-group">
                                            
                                            <input [type]="show ? 'text' : 'password'" class="form-control" minlength="8" formControlName="password" [class.is-invalid]="invalidPassword" type="password" required  >
                                            <div class="input-group-append">
                                                <button (click)="show_password()" class="btn btn-primary rounded-lg" type="button">
                                                    <span *ngIf="show" class="fa fa-eye-slash icon mr-1"></span>
                                                    <i *ngIf="!show" class="fas fa-eye mr-1"></i> 
                                                </button>
                                            </div>
                                            
                                        </div>
                                        <small *ngIf="invalidPassword" class="text-danger password-requiered">
                                            This field is requiered
                                        </small>
                                        <small class="text-danger"
                                        *ngIf="this.user.get('password').errors?.minlength">
                                        (The password must have 8 characters minumun)
                                    </small>
                                    </div>
                                    
                                </div>
                            </div>
                            <div class="col">

                                <div class="form-group">
                                    <label> Password Confirmation </label>
                                    <input class="form-material form-control" type="password" min="8"
                                        formControlName="password_confirmation"
                                        [class.is-invalid]="invalidConfirmPassword" [class.is-invalid]="!password"
                                        required />
                                    <small *ngIf="invalidPassword" class="text-danger">
                                        This field is requiered
                                    </small>
                                    <small *ngIf="!password" class="text-danger">
                                        Check yours Password
                                    </small>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="container col-sm-7">
                                <button type="submit" [class.is-invalid]="!password" [disabled]="user.invalid"
                                    class="btn btn-success btn-block fas">
                                    SAVE <i class="fas fa-user-plus"></i>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

            </div>
        </div>

    </div>
</div>
