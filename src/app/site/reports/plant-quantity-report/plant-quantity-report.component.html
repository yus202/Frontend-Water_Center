<div id="TreesQuantities" class="container-fluid">
    <div class="container col-11">
        <div class="row">
            <div id="content" *ngFor="let item of plantsQuantities; let i = index" class="col-sm-12 col-md-6">
                <img class="mt-5" *ngIf="i == 1" src="../../../../assets/images/gardening.png" alt="plantImage">
                <img class="mt-5" *ngIf="i == 0" src="../../../../assets/images/pot.png" alt="plantImage">
                <h1>{{item.Name}}</h1>
                <h1 style="font-weight: bold;" [countUp]= "item.Quantity">0</h1>
            </div>
        </div>
    </div>
</div>
