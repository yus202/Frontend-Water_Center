<!---->


<div class="container">
  <div *ngFor="let Info of gwrow" class="col-sm-12 col-md-12 col-xl-12">
    <div class="col-lg-12">

      <div class="container mt-5 text-center">
        <div class="row">
          <div  class="col">
            <h1 id="textHistory" *ngIf="LanguajeID == 1">History</h1>
            <h1 id="textHistory" *ngIf="LanguajeID == 2">Historia</h1>
          </div>
        </div>
      </div>
      
      <hr />

      <div class="col">
        <div class="row">
          <P>{{ Info.description }}</P>
        </div>
        <div class="row">
          <p class="text-justify">{{ Info.paragraph1 }}</p>
        </div>
        <div class="row">
          <p class="text-justify">{{ Info.paragraph2 }}</p>
        </div>
      </div>

      <div class="row containerText mb-5">
        <div class="col-sm-6 mt-5 text-center">
          <img class="img-fluid" src="{{ Info.image }}" alt="IMAGE SCENARY" />
        </div>
        <div class="col-sm-6 mt-5 text-center">
          <div class="row">
            <p class="font-italic text-justify text-image">{{ Info.paragraph3 }}</p>
          </div>

        </div>
      </div>

      <hr style="width: 0%" color="#774F38" />

      <div class="col mb-4">
        <div class="row">
          <P class="text-justify">{{ Info.paragraph4 }}</P>
        </div>
        <div class="row">
          <p class="text-justify">{{ Info.paragraph5 }}</p>
        </div>
      </div>
    </div>

  </div>
</div>
