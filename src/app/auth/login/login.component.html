<!-- ============================================================== -->
<!-- Main wrapper - style you can find in pages.scss -->
<!-- ============================================================== -->


<div class="container-fluid animated fadeIn">
  <section id="wrapper" class="login-register login-sidebar">
    <div class="login-box card rounded-lg">
      <div class="card-body shadow p-4 bg-white rounded ">

        <form #form="ngForm" [formGroup]="user" (ngSubmit)="onSubmit( )" class="form-horizontal form-material">
          <a href="javascript:void(0)" class="text-center db"><img src="assets/images/logo-icon.png" height="50%"
              width="50%" alt="Home" /><br /></a>
          <h2 class="text-center">Guanacaste Water Center</h2>




          <div class="container">
            <div class="form-group m-t-40">
              <div class="col-xs-12">
                <input class="form-control" formControlName="email" [class.is-invalid]="invalidEmail" type="email"
                  required placeholder="Email Address">
                <small *ngIf="invalidEmail" class="text-danger">
                  This field is requiered
                </small>
              </div>
            </div>

            <div class="form-group">
              <div class="form-row form-group password">
                <div class="input-group">
                  <input [type]="show ? 'text' : 'password'" class="form-control" minlength="8"
                    formControlName="password" [class.is-invalid]="invalidPassword" type="password" required
                    placeholder="Password">
                  <div class="input-group-append">
                    <button (click)="show_password()" class="btn btn-primary rounded-lg" type="button">
                      <span *ngIf="show" class="fa fa-eye-slash icon mr-1"></span>
                      <i *ngIf="!show" class="fas fa-eye mr-1"></i>
                    </button>
                  </div>

                </div>
                <small *ngIf="invalidPassword" class="text-danger password-requiered">
                  This field is requiered
                </small>
              </div>

            </div>

            <div class="form-group row">
              <div class="col-5 text-left">
                <div class="checkbox checkbox-primary text-center">
                  <input formControlName="remenberUser" name="recuerdame" id="checkbox-signup" type="checkbox"
                    class="filled-in chk-col-light-blue ">
                  <label  for="checkbox-signup">Remember</label>
                </div>
              </div>
              <div class="col-7 text-right">
                <a [routerLink]="[ '/reset-password']" class="text-dark pull-right"><i class="fa fa-lock m-r-5"></i>Forgot your Password?</a>
              </div>

            </div>
            <div class="form-group text-center m-t-20">
              <div class="col-xs-12">
                <button [disabled]="form.invalid" class="btn btn-info btn-lg btn-block text-uppercase btn-rounded"
                  type="submit">Login</button>
              </div>

              <div class="container pt-2">
                <a [routerLink]="[ '/home']" class="text-dark pull-center">Back to Home</a>
              </div>

            </div>
          </div>
        </form>
        
      </div>
    </div>
  </section>
</div>

<!-- ============================================================== -->
<!-- End Wrapper -->
<!-- ============================================================== -->
